name: Run Trading Bot

on:
  schedule:
    # Runs at minute 5, every hour (catches both 1H and 4H setups)
    - cron: '5 * * * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button

jobs:
  scan-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
