name: Keep backend awake

# Render's free tier sleeps the backend after ~15 minutes without traffic —
# the next visitor's first /api call then cold-starts for 30-60 seconds.
# This pings /api/health every 10 minutes so the service stays warm 24/7.
# Free: the repo is public, so GitHub Actions minutes are unlimited.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -sS --max-time 60 \
            "https://fourh-bot-terminal.onrender.com/api/health" \
            -w "\nHTTP %{http_code} in %{time_total}s\n"
